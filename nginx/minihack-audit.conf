# =============================================================================
# NGINX CONFIG - audit.theminihack.com
# Certificado SSL: Cloudflare Origin Certificate (compartido con *.theminihack.com)
# Colocar en: /etc/nginx/sites-available/minihack-audit
# Activar con: sudo ln -sf /etc/nginx/sites-available/minihack-audit /etc/nginx/sites-enabled/
# =============================================================================

server {
    listen 80;
    server_name audit.theminihack.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name audit.theminihack.com;

    # Resolver la IP real del visitante (rangos Cloudflare, ver TheMiniHack/nginx/cloudflare-realip.conf)
    include /etc/nginx/snippets/cloudflare-realip.conf;

    # Certificado Cloudflare Origin (compartido de *.theminihack.com)
    ssl_certificate     /etc/nginx/ssl/theminihack/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/theminihack/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 25M; # Permitir subida de evidencias pesadas (PDFs/Imágenes)

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Logs
    access_log /var/log/nginx/audit-access.log;
    error_log  /var/log/nginx/audit-error.log;

    location ^~ /static/uploads/ {
        return 404;
    }

    location ^~ /static/reports/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:5005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_cache_bypass $http_upgrade;
    }
}
